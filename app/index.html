<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutline — Black Friday price desk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="head">
  <div class="wrap head-in">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand">Cutline</span>
    <span class="tagline">Black Friday price desk — verified 28 Nov 2026.</span>
    <span class="head-right"><span><b id="headCount">60 deals</b> · 4 stores</span><span class="ends">Sale ends Mon 30 Nov</span></span>
  </div>
</header>
<div class="stats"><div class="wrap stats-in" id="stats"></div></div>

<section class="hero" id="hero" aria-label="Deal of the day">
  <div class="wrap hero-in">
    <div class="hero-main">
      <div class="eyebrow">DEAL OF THE DAY</div>
      <div class="hero-name" id="heroName"></div>
      <div class="hero-chips" id="heroChips"></div>
    </div>
    <div class="hero-price">
      <div><span class="hero-sale" id="heroSale"></span><span class="hero-badge" id="heroPct"></span></div>
      <div class="hero-usual"><s id="heroUsual"></s><span class="hero-save" id="heroSave"></span></div>
      <a class="hero-cta" id="heroCta" href="#" target="_blank" rel="noopener">See deal ↗</a>
    </div>
  </div>
</section>
<div class="hero-chip" id="heroChip">
  <div class="wrap hero-chip-in"><span class="lbl">DEAL OF THE DAY</span><a id="chipLink" href="#" target="_blank" rel="noopener"></a><span class="pct" id="chipPct"></span><span id="chipPrice"></span></div>
</div>

<div class="filters wrap">
  <div class="pills" id="pills" role="group" aria-label="Category"></div>
  <div class="controls">
    <div class="seg" id="verdictSeg" role="group" aria-label="Verdict"></div>
    <label class="search" id="searchBox"><input id="q" type="search" placeholder="Search deals…" autocomplete="off" aria-label="Search deals"><button class="x" id="clearQ" type="button" aria-label="Clear search">✕</button></label>
    <select id="store" aria-label="Store"></select>
    <select id="minOff" aria-label="Minimum discount">
      <option value="0">Any discount</option>
      <option value="30">30% off or more</option>
      <option value="50">50% off or more</option>
      <option value="60">60% off or more</option>
    </select>
    <select id="maxPrice" aria-label="Maximum price">
      <option value="0">Any price</option>
      <option value="100">Under $100</option>
      <option value="250">Under $250</option>
      <option value="500">Under $500</option>
    </select>
    <button class="toggle" id="realOnly" type="button" aria-pressed="false">Real deals only</button>
    <select id="sort" aria-label="Sort">
      <option value="pct">Biggest % off</option>
      <option value="saved">Biggest $ saved</option>
      <option value="low">Price low → high</option>
      <option value="high">Price high → low</option>
    </select>
    <button class="clear" id="clearAll" type="button">Clear ✕</button>
  </div>
  <p class="result" id="resultLine"></p>
</div>

<main class="wrap"><div class="grid" id="grid"></div></main>

<footer class="wrap footbar">
  <div class="legend" id="legend"></div>
  <p>Every price was checked at the store or in the source named on its card, 28 Nov 2026. Prices can move; the store page is the final word.</p>
  <button class="copy" id="copyLink" type="button">Copy link to this view</button>
</footer>

<template id="cardTpl">
  <a class="card" target="_blank" rel="noopener">
    <span class="meta"><span class="sc"></span><span class="verdict"></span></span>
    <span class="cname"></span>
    <span class="price"><span class="sale"></span><span class="pct"></span></span>
    <span class="compare"><s></s><span class="save"></span></span>
    <span class="note"></span>
    <span class="also"></span>
    <span class="foot"><span class="src"></span><span class="view">View deal ↗</span></span>
  </a>
</template>

<script src="deals.js"></script>
<script src="app.js"></script>
</body>
</html>
